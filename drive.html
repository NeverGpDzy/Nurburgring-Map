<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="format-detection" content="telephone=no">
  <title>Nürburgring Drive</title>
  <meta name="description" content="First-person cruise around the Nürburgring Nordschleife.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nürburgring Drive">
  <meta property="og:description" content="First-person cruise around the Nürburgring Nordschleife.">
  <meta property="og:image" content="assets/screenshot.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nürburgring Drive">
  <meta name="twitter:description" content="First-person cruise around the Nürburgring Nordschleife.">
  <meta name="twitter:image" content="assets/screenshot.jpg">
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var forced = params.get("lang");
      var current = "en";
      if (forced === "cn" || forced === "en") {
        current = forced;
      } else {
        var nav = [];
        if (window.navigator && window.navigator.languages && window.navigator.languages.length) {
          nav = nav.concat(window.navigator.languages);
        }
        if (window.navigator && window.navigator.language) {
          nav.push(window.navigator.language);
        }
        if (nav.some(function (item) { return /^zh-/i.test(item); })) {
          current = "cn";
        }
      }
      window.lang = current;
      document.documentElement.lang = current === "cn" ? "zh-Hans" : "en";
    })();
  </script>
  <link rel="stylesheet" href="assets/drive.css">
</head>
<body>
  <div class="drive-app">
    <canvas id="driveCanvas" class="scene"></canvas>

    <div class="hud">
      <div class="hud-top">
        <section class="panel brand">
          <div id="driveTitle" class="brand-title">Nürburgring Drive</div>
          <div id="driveSubtitle" class="brand-subtitle">Nordschleife</div>
        </section>

        <section class="panel sector">
          <div id="sectorLabel" class="sector-label">T13 / Start</div>
          <div class="sector-meta">
            <span class="meta-chip"><span class="meta-dot"></span><span id="sectorBadge">Pit lane</span></span>
            <span class="meta-chip" id="lapText">Lap 1</span>
            <span class="meta-chip" id="progressText">0.0%</span>
          </div>
        </section>

        <section class="panel minimap" aria-label="Track overview">
          <svg viewBox="0 0 660 530" aria-hidden="true">
            <use href="#drive-track" class="map-path"></use>
            <circle id="mapDot" class="map-dot" cx="0" cy="0" r="5"></circle>
          </svg>
        </section>
      </div>

      <div class="hud-bottom">
        <section class="panel speed-panel">
          <div class="speed-value">
            <span id="speedNumber" class="speed-number">180</span>
            <span class="speed-unit">km/h</span>
          </div>
          <div id="speedNote" class="speed-note">AUTO CRUISE</div>
        </section>

        <section class="panel range-panel">
          <div class="controls">
            <button id="toggleBtn" class="control-btn" type="button">
              <span id="toggleIcon" aria-hidden="true"></span>
              <span id="toggleLabel">Pause</span>
            </button>
            <button id="resetBtn" class="control-btn" type="button">
              <span id="resetIcon" aria-hidden="true"></span>
              <span id="resetLabel">Reset</span>
            </button>
            <a id="backBtn" class="control-btn" href="index.html?lang=en">
              <span id="backIcon" aria-hidden="true"></span>
              <span id="backLabel">Map</span>
            </a>
          </div>

          <div class="range-row">
            <strong id="speedLabel">Cruise</strong>
            <input id="speedSlider" type="range" min="60" max="280" step="5" value="180">
            <output id="speedValue">180</output>
          </div>

          <div class="range-row progress-row">
            <strong id="progressLabel">Position</strong>
            <input id="progressSlider" type="range" min="0" max="1000" step="1" value="0">
            <output id="progressValue">0.0%</output>
          </div>
        </section>
      </div>

      <div class="status">
        <div id="statusLine" class="status-line">RUNNING</div>
        <div id="statusSub" class="status-sub">AUTO CRUISE</div>
      </div>
    </div>

    </svg>
  </div>

  <script src="assets/three.min.js"></script>
  <script src="assets/drive.js"></script>
</body>
</html>
